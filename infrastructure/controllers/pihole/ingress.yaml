type: LoadBalancer
loadBalancerClass: tailscale

selector:
  app.kubernetes.io/name: pihole

ports:
  - name: dns-tcp
    port: 53
    targetPort: dns-tcp
    protocol: TCP

  - name: dns-udp
    port: 53
    targetPort: dns-udp
    protocol: UDP

  - name: http
    port: 80
    targetPort: http
    protocol: TCP