apiVersion: v1
kind: Service

metadata:
  name: pihole
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: townsville

spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: pihole

  ports:
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: dns-tcp
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: dns-udp
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
