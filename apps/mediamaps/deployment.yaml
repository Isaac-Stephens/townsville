apiVersion: apps/v1
kind: Deployment

metadata:
  name: mediamaps
  namespace: mediamaps

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediamaps

  template:
    metadata:
      labels:
        app: mediamaps

    spec:
      imagePullSecrets:
        - name: ghcr-credentials

      containers:
        - name: mediamaps
          image: ghcr.io/florgropuli-evil-incorporated/mediamaps:sha-b5720f76781d515c0edbadd6cfc0544fc09c8bf3
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mediamaps-secrets
                  key: SECRET_KEY