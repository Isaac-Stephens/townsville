apiVersion: apps/v1
kind: Deployment

metadata:
  name: mediamaps
  namespace: mediamaps

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediamaps

  template:
    metadata:
      labels:
        app: mediamaps

    spec:
      imagePullSecrets:
        - name: ghcr-credentials

      containers:
        - name: mediamaps
          image: ghcr.io/kalelsonger/florgropuli@sha256:a5ea529f14029a2f64f05c781a02fa503bb7183e564d39c8f765e5e04a1163a2